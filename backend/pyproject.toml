[project]
name = "mkt-rp-assistant-backend"
version = "0.1.0"
description = "Foundation FastAPI service for the AI Marketing Report Assistant"
requires-python = ">=3.12.2,<3.13"
dependencies = [
  "boto3==1.44.0",
  "fastapi==0.162.4",
  "psycopg[binary]==3.3.8",
  "pydantic-settings==2.16.2",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.1.8",
  "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
  "alembic==1.17.2",
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-postgresql==7.0.2",
  "ruff==0.14.2",
]

[tool.uv]
required-version = "==0.13.7"
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/db/models.py" = ["E501"]
"alembic/versions/*.py" = ["E501", "I001", "S608", "UP007", "UP035"]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: requires the fail-closed isolated PostgreSQL test database",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
